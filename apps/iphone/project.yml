# Assemble 手机应用的工程定义。工程文件不进仓库，每次从这份定义生成：
#
#   xcodegen generate                      模拟器或不需要签名身份的构建
#   DEVELOPMENT_TEAM=<团队> xcodegen generate   装到真机上
#
# 服务地址在生成的时候定下，应用里没有可以填地址的地方：
#
#   ASSEMBLE_SERVER_ORIGIN=https://… xcodegen generate
#
# 不设的话连本机开发服务（http://127.0.0.1:8787），模拟器里用得着。
name: Assemble
options:
  bundleIdPrefix: com.puzzlefuzzy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    # 装到真机上时由生成那一步带进来；模拟器不需要。
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  AssembleCore:
    path: .
targets:
  Assemble:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: AssembleCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.puzzlefuzzy.assemble.ios
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        # 图标是 `bun run icons` 生成的占位点阵（和桌面端同一个字母），铺满整个正方形，圆角由系统来切。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Assemble
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: 扫描电脑上显示的二维码，用来登录你的账户。
        CFBundleURLTypes:
          - CFBundleURLName: com.puzzlefuzzy.assemble.ios
            CFBundleURLSchemes:
              - assemble
        AssembleServerOrigin: "${ASSEMBLE_SERVER_ORIGIN}"
        # 连本机开发服务时走明文的 HTTP；正式服务是 HTTPS，用不到这一条。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  AssembleTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: AppTests/Unit
      # 样本由 Rust 侧生成；整个目录作为资源带上，测试按名字读。
      - path: Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Assemble
  AssembleUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: AppTests/UI
    dependencies:
      - target: Assemble
schemes:
  Assemble:
    build:
      targets:
        Assemble: all
        AssembleTests: [test]
        AssembleUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AssembleTests
        - AssembleUITests
