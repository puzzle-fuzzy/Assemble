[package]
name = "assemble-server"
version.workspace = true
edition.workspace = true
# 服务端依赖的 sqlx 0.9 要求 Rust 1.94 以上；工作区的下限现在比它还高。
rust-version.workspace = true
publish.workspace = true
description = "Assemble 服务端：账户、设备、云盘与文件中转"
default-run = "assemble-server"

[lib]
name = "assemble_server"
path = "src/lib.rs"

[[bin]]
name = "assemble-server"
path = "src/main.rs"

[dependencies]
assemble-protocol.workspace = true
assemble-dht.workspace = true
assemble-schedule.workspace = true
assemble-store.workspace = true
assemble-transfer.workspace = true
argon2.workspace = true
axum.workspace = true
axum-extra.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
futures-core.workspace = true
futures-util.workspace = true
fs4.workspace = true
getrandom.workspace = true
image.workspace = true
email_address = "0.2.10"
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
reqwest = { workspace = true, features = ["form"] }
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
subtle.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
assemble-client.workspace = true
# 只有示例 `fake_device` 用到：替身收文件时走与桌面端相同的落盘规则。
assemble-device.workspace = true
futures-util.workspace = true
reqwest = { workspace = true, features = ["cookies", "form"] }
tempfile.workspace = true

[lints]
workspace = true
