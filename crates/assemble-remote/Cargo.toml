[package]
name = "assemble-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "远程桌面的输入边界、坐标和本机采集适配"

[[example]]
name = "capture"
required-features = ["native"]

[features]
native = ["dep:enigo", "dep:xcap", "dep:image", "dep:arboard", "dep:openh264", "dep:cpal", "dep:opus2", "dep:screencapturekit"]

[dependencies]
assemble-protocol.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
# 只启用现用 Noise 套件的默认纯 Rust 实现；snow 的 std 特性会额外拉入未使用的 ring C 代码。
snow = { version = "=0.10.0", default-features = false, features = [
  "use-chacha20poly1305",
  "use-sha2",
  "use-curve25519",
  "use-getrandom",
] }
image = { workspace = true, optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
enigo = { version = "=0.6.1", optional = true }
xcap = { version = "=0.9.10", optional = true }
arboard = { version = "=3.7.0", default-features = false, optional = true }
openh264 = { version = "=0.9.10", optional = true }
opus2 = { version = "=0.4.0", features = ["bundled"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
cpal = { version = "=0.18.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "=11.0.0", optional = true }

[lints]
workspace = true
