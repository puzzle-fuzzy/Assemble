# 一次性诊断：Windows 上桌面应用壳的测试程序以 0xc0000139（找不到入口点）退出。
# 查完就删掉这个文件。

name: 诊断 Windows 导入

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: 导入表里哪些函数在系统的 DLL 里找不到
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: 编译测试程序（不运行）
        run: cargo test -p assemble-desktop --lib --no-run
      - name: 直接运行一次，看系统日志里怎么说
        shell: pwsh
        run: |
          $exe = Get-ChildItem target\debug -Recurse -Filter assemble_desktop_lib-*.exe | Select-Object -First 1
          Write-Host "程序：$($exe.Name)"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--list' -PassThru -Wait -ErrorAction SilentlyContinue
          Write-Host "退出码：0x{0:X8}" -f $p.ExitCode
          Start-Sleep -Seconds 2
          Write-Host "--- 系统日志里最近 10 分钟的弹窗记录"
          Get-WinEvent -LogName System -FilterHashtable @{Id=26; StartTime=(Get-Date).AddMinutes(-10)} -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host $_.Message }
          Write-Host "--- 应用程序日志里最近的错误"
          Get-WinEvent -LogName Application -FilterHashtable @{Level=2; StartTime=(Get-Date).AddMinutes(-10)} -ErrorAction SilentlyContinue |
            Select-Object -First 5 | ForEach-Object { Write-Host $_.Message }
      - name: 逐个核对导入的函数在不在
        shell: pwsh
        run: |
          $exe = Get-ChildItem target\debug -Recurse -Filter assemble_desktop_lib-*.exe | Select-Object -First 1
          $dumpbin = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          Write-Host "dumpbin：$($dumpbin.FullName)"
          Write-Host "--- 依赖的 DLL"
          & $dumpbin.FullName /nologo /dependents $exe.FullName | Where-Object { $_ -match '\.dll' } | ForEach-Object { Write-Host $_.Trim() }
          $lines = & $dumpbin.FullName /nologo /imports $exe.FullName
          $dll = $null
          $imports = @{}
          foreach ($line in $lines) {
            if ($line -match '^\s{4}(\S+\.dll)\s*$') { $dll = $Matches[1].ToLower(); $imports[$dll] = @() }
            elseif ($dll -and $line -match '^\s+[0-9A-Fa-f]+\s+(\S+)\s*$') { $imports[$dll] += $Matches[1] }
          }
          $missing = 0
          foreach ($name in $imports.Keys) {
            $path = Join-Path $env:SystemRoot "System32\$name"
            if (-not (Test-Path $path)) { Write-Host "找不到 DLL：$name"; $missing++; continue }
            $exports = & $dumpbin.FullName /nologo /exports $path | ForEach-Object { $_.Trim() }
            foreach ($function in $imports[$name]) {
              if (-not ($exports | Where-Object { $_ -match "\s$([regex]::Escape($function))$" })) {
                Write-Host "缺入口点：$name 里没有 $function"
                $missing++
              }
            }
          }
          Write-Host "一共 $missing 处找不到"
