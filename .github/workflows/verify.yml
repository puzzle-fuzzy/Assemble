# 每次推送与合并请求，在 macOS 与 Windows 上各跑一遍完整验证。
#
# 界面与 Rust 的测试本来就该与平台无关，但 Windows 专用的代码只有 Windows 能编译、能运行；
# 客户端（TLS）与服务端（SQLite）带着本机依赖，它们的 Windows 目标也只有 Windows 自己能检查。
# 哪一边失败就是那一边的问题，所以一边失败不叫停另一边（fail-fast 关掉）。

name: 验证

on:
  push:
    branches: [main]
  pull_request:

# 同一个分支上来了新的推送，旧的那一次就不必跑完。
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS（arm64）
            os: macos-15
          - name: Windows（x64）
            os: windows-2025
    steps:
      - uses: actions/checkout@v7
      # 系统音频依赖的 Swift/Metal 桥接需要 26 SDK；运行器默认仍是 Xcode 16.4。
      # 固定构建 SDK，不改变桌面应用的 macOS 13 最低运行版本。
      - name: 选择 Xcode 26.3
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      # 工具链由仓库根目录的 rust-toolchain.toml 决定：第一次调用 cargo 时 rustup 自动把它装好，
      # 连同 clippy、rustfmt 和 Windows 目标（macOS 上给五个基础库做针对 Windows 的静态检查要用）。
      - uses: Swatinem/rust-cache@v2
      # 版本取根目录 package.json 的 packageManager 字段。
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run verify
      # iOS 应用的核心包是 Swift，要 Xcode 的工具链：只在 macOS 那一栏测。
      # 样本由 Rust 侧的测试生成并比对，所以协议一改这里也先红。
      - run: bun run ios:test
        if: runner.os == 'macOS'
