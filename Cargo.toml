[workspace]
resolver = "3"
members = ["crates/*", "apps/server", "apps/desktop/src-tauri", "apps/mcp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 与 rust-toolchain.toml 钉住的版本一致：只在这个版本上验证过，不对更老的编译器作承诺。
rust-version = "1.100.0"
publish = false

[workspace.dependencies]
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
assemble-client = { path = "crates/assemble-client" }
assemble-device = { path = "crates/assemble-device" }
assemble-dht = { path = "crates/assemble-dht" }
assemble-download = { path = "crates/assemble-download" }
assemble-protocol = { path = "crates/assemble-protocol" }
assemble-schedule = { path = "crates/assemble-schedule" }
assemble-server = { path = "apps/server" }
assemble-store = { path = "crates/assemble-store" }
assemble-transfer = { path = "crates/assemble-transfer" }

argon2 = "0.6.0"
axum = { version = "0.8.9", default-features = false, features = [
  "form",
  "http1",
  "json",
  "macros",
  "query",
  "tokio",
] }
axum-extra = { version = "0.12.6", default-features = false, features = [
  "cookie",
] }
base64 = "0.23.1"
bytes = "1.12.2"
chrono = { version = "0.4.45", default-features = false, features = [
  "clock",
  "std",
] }
clap = { version = "4.6.9", features = ["derive"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = [
  "std",
] }
getrandom = "0.4"
hmac = "0.13.0"
mime_guess = "2.0.5"
m3u8-rs = "6.0.1"
md-5 = "0.11.0"
# 桌面端更新包的签名核对（服务端发布时用；桌面应用自己那一遍在更新插件里）。
minisign-verify = "0.3.0"
# system-proxy：公司网络里常有系统级代理设置，桌面端应当遵从它。
rpassword = "7.5.5"
# 问一块磁盘还剩多少地方（statvfs / GetDiskFreeSpaceEx）。下载开始之前要看一眼余量，
# 不然一路写到把别人正用着的盘写满才知道。fs2 已经没人维护，fs4 是它的后继。
fs4 = "1.1.0"
# MCP 的官方 Rust SDK。它发版很勤（四周里六个版本），所以钉死：升级必须是有意的，
# 升完把 tools 的测试和真实客户端各走一遍。只开 stdio 服务端必需的 feature——全开的话
# 它会把 HTTP 客户端、OAuth 那一整套都拖进来，而这个入口只走标准输入输出。
rmcp = { version = "=3.11.0", default-features = false, features = [
  "macros",
  "server",
  "transport-io",
] }
# 工具参数的 JSON Schema 由它从类型上生成；是 rmcp 用的同一个版本，不要各升各的。
schemars = "1.2.3"
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "query",
  "rustls",
  "stream",
  "system-proxy",
] }
semver = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = [
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlite",
] }
subtle = "2.6.1"
# 默认 feature 里的 common-controls-v6 不要：它让运行时与菜单去用只有通用控件库 6.0 才有的
# TaskDialogIndirect，而库的单元测试是另一个可执行文件，没有应用清单，Windows 给它的是
# 5.82 的旧版——测试程序一启动就以 STATUS_ENTRYPOINT_NOT_FOUND 退出，一个测试都没跑
# （持续集成的 Windows 一栏抓到的，2026-11-24）。它只服务于预置的"关于"菜单项和
# 运行时的消息对话框，这两样我们都没用。其余默认 feature 原样保留。
tauri = { version = "2.12.7", default-features = false, features = [
  "wry",
  "compression",
  "dynamic-acl",
  "x11",
  "dbus",
  "tray-icon",
  "image-png",
] }
tauri-build = { version = "2.7.6", features = [] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
tempfile = "3.27.0"
thiserror = "2.0.21"
# cookie 的 Max-Age 用的是这个库的时长类型。
time = "0.3.55"
tokio = { version = "1.54.1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.1", default-features = false, features = [
  "fs",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "env-filter",
  "fmt",
  "json",
] }
url = "2.5.9"
zeroize = "1.9.2"

[workspace.lints.rust]
unsafe_code = "forbid"

# 库代码保持较严格的 clippy 检查；纯标注类规则与文档类规则不强制。
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
