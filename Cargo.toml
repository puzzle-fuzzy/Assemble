[workspace]
resolver = "3"
members = ["crates/*", "apps/server", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
assemble-client = { path = "crates/assemble-client" }
assemble-device = { path = "crates/assemble-device" }
assemble-protocol = { path = "crates/assemble-protocol" }
assemble-schedule = { path = "crates/assemble-schedule" }
assemble-store = { path = "crates/assemble-store" }
assemble-transfer = { path = "crates/assemble-transfer" }

argon2 = "0.6.0"
axum = { version = "0.8.9", default-features = false, features = [
  "form",
  "http1",
  "json",
  "query",
  "tokio",
] }
axum-extra = { version = "0.12.6", default-features = false, features = [
  "cookie",
] }
base64 = "0.23.1"
bytes = "1.12.2"
chrono = { version = "0.4.45", default-features = false, features = [
  "clock",
  "std",
] }
clap = { version = "4.6.9", features = ["derive"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = [
  "std",
] }
getrandom = "0.4"
mime_guess = "2.0.5"
# system-proxy：公司网络里常有系统级代理设置，桌面端应当遵从它。
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "query",
  "rustls",
  "stream",
  "system-proxy",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = [
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlite",
] }
subtle = "2.6.1"
tauri = { version = "2.12.7", features = ["tray-icon", "image-png"] }
tauri-build = { version = "2.7.6", features = [] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.1", default-features = false, features = [
  "fs",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "env-filter",
  "fmt",
  "json",
] }
url = "2.5.9"
zeroize = "1.9.2"

[workspace.lints.rust]
unsafe_code = "forbid"

# 库代码保持较严格的 clippy 检查；纯标注类规则与文档类规则不强制。
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
