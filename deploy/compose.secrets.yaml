# 密钥文件部署时叠加：docker compose -f compose.yaml -f compose.secrets.yaml up -d
# 先创建 secrets/，目录与文件属于容器账户 10001，权限分别为 0700、0400。
# 不自动创建空目录，避免误把缺少密钥当成可用配置。
services:
  assemble:
    volumes:
      - type: bind
        source: ./secrets
        target: /run/assemble-secrets
        read_only: true
        bind:
          create_host_path: false
